<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MuchAI app icon — Art-Nouveau monogram "M" (Alfons Mucha homage).
       Bold gold glyph on a deep-green panel: the M core reads at 32px, the
       double frame + apex curls + vine flourish enrich the larger sizes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6f5a"/>
      <stop offset="1" stop-color="#264a3c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#f2dfa4"/>
      <stop offset="0.5" stop-color="#d8b56a"/>
      <stop offset="1" stop-color="#b58f47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#4f8865" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#264a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- panel -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#glow)"/>

  <!-- double art-nouveau frame (the Mucha "halo") -->
  <rect x="50" y="50" width="412" height="412" rx="82" fill="none"
        stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
  <rect x="64" y="64" width="384" height="384" rx="70" fill="none"
        stroke="url(#gold)" stroke-width="2" opacity="0.5"/>

  <!-- corner beads -->
  <g fill="url(#gold)">
    <circle cx="50" cy="50" r="7"/>
    <circle cx="462" cy="50" r="7"/>
    <circle cx="50" cy="462" r="7"/>
    <circle cx="462" cy="462" r="7"/>
  </g>

  <!-- monogram M: whiplash-curved outer legs, sharp valley -->
  <path d="M150 356 C143 296 143 230 152 176 L256 300 L360 176 C369 230 369 296 362 356"
        fill="none" stroke="url(#gold)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- apex whiplash curls (detail for large sizes) -->
  <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round">
    <path d="M152 176 C118 148 108 178 132 194"/>
    <path d="M360 176 C394 148 404 178 380 194"/>
  </g>

  <!-- vine flourish rising from the M's valley -->
  <path d="M256 306 C256 348 256 372 256 396" fill="none"
        stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <g fill="url(#gold)">
    <path d="M256 354 C235 348 218 359 212 380 C238 381 252 372 256 354 Z"/>
    <path d="M256 372 C277 366 294 377 300 398 C274 399 260 390 256 372 Z"/>
    <circle cx="256" cy="402" r="9"/>
  </g>
</svg>
